name: DIAG ruby build (macOS)

# Temporary, fast diagnostic: the real build crashes gcc (cc1 internal compiler
# error / segfault) while compiling Ruby under Colima. Test Colima tunings to
# find a stable configuration. Delete once the cause is found.

on:
  push:
    branches:
      - worktree-add_macos_test

jobs:
  diag-ruby:
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vz
            colima_args: "--vm-type vz --cpu 4 --memory 12 --disk 30"
          - name: qemu-lowparallel
            colima_args: "--cpu 2 --memory 13 --disk 30"
    steps:
      - name: Install Docker via Colima (${{ matrix.name }})
        run: |
          brew install colima docker
          colima start ${{ matrix.colima_args }}
          sudo ln -sf "$HOME/.colima/default/docker.sock" /var/run/docker.sock
          docker version

      - name: Reproduce ruby build (${{ matrix.name }})
        run: |
          docker run --rm \
            debian:trixie \
            bash -euxc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq \
                build-essential libssl-dev libyaml-dev libreadline6-dev \
                zlib1g-dev libncurses5-dev libffi-dev libgdbm6 libgdbm-dev \
                curl ca-certificates wget gpg procps >/dev/null

              echo "=== resources ==="
              nproc || true; free -m || true

              install -dm 755 /etc/apt/keyrings
              wget -qO - https://mise.jdx.dev/gpg-key.pub | gpg --dearmor -o /etc/apt/keyrings/mise-archive-keyring.gpg
              echo "deb [signed-by=/etc/apt/keyrings/mise-archive-keyring.gpg arch=amd64] https://mise.jdx.dev/deb stable main" > /etc/apt/sources.list.d/mise.list
              apt-get update -qq
              apt-get install -y -qq mise >/dev/null
              mise --version

              echo "=== build ruby@latest ==="
              if mise use -g ruby@latest; then
                echo "RESULT ${{ matrix.name }}: RUBY BUILD OK"
                mise exec -- ruby --version
              else
                echo "RESULT ${{ matrix.name }}: RUBY BUILD FAILED"
                exit 1
              fi
            '
