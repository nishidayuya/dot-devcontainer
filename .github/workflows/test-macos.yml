name: CI (macOS)

on:
  push:
    branches:
      - main
      - worktree-add_macos_test
  pull_request:
    branches: [ main ]

jobs:
  test-macos:
    # Intel (x86_64) runner. The devcontainer Dockerfile pins the mise apt
    # source to arch=amd64, so an arm64 runner (macos-14/15 default) would
    # fail to install mise; arm64 runners also cannot run Colima's VM
    # (nested virtualization is unsupported -> HV_UNSUPPORTED). macos-13 is
    # retired, so use the current Intel image macos-15-intel.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Docker via Colima
        run: |
          # macOS GitHub runners do not ship a Docker daemon. Colima provides
          # a Linux VM with a Docker daemon that the devcontainer CLI can use.
          df -h /
          brew install colima docker
          # Colima makes itself the default docker context on start.
          # Build tuning: ruby-build compiles Ruby with `make -j <nproc>`, and
          # at 4 parallel jobs gcc's cc1 intermittently hits an internal
          # compiler error (segfault) under the Colima VM. Capping the VM at 2
          # CPUs (so make runs -j2) with a bit more memory builds reliably.
          # Raised memory also avoids OOM during the heavy image build (the
          # 2 GiB default is far too small).
          # Pin reliable DNS servers: Colima's default VM resolver is flaky and
          # intermittently fails to resolve hosts like ghcr.io during the build
          # (getaddrinfo ENOTFOUND). 8.8.8.8/8.8.4.4 are also what
          # setup-firewall.sh allows for DNS, so this stays consistent.
          colima start --cpu 2 --memory 13 --disk 30 --dns 8.8.8.8 --dns 8.8.4.4
          # Some tooling hardcodes /var/run/docker.sock instead of honoring the
          # docker context; symlink Colima's socket there as insurance.
          sudo ln -sf "$HOME/.colima/default/docker.sock" /var/run/docker.sock
          docker version
          docker info

      - name: Install devcontainer CLI and AI tools
        run: |
          npm install -g @devcontainers/cli
          # Antigravity CLI is a native binary installed to ~/.local/bin/agy (not on npm)
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare mock files for mounts and authentication
        run: |
          mkdir -p ~/.claude ~/.gemini
          # Create dummy credential files to simulate web authentication
          echo '{"loggedIn": true, "dummy": true}' > ~/.claude/.credentials.json
          echo '{}' > ~/.claude.json
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"

      - name: Prepare environment
        run: |
          # Ensure GH_TOKEN is set for initializeCommand
          echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" > .devcontainer/.env
          # Mock SSH agent
          ssh-agent -a /tmp/ssh-agent.sock > /dev/null
          echo "SSH_AUTH_SOCK=/tmp/ssh-agent.sock" >> $GITHUB_ENV

      - name: Run test.sh
        # The build pulls a lot over the network from inside the Colima VM
        # (base image, apt, mise/ruby, claude.ai, antigravity, ghcr.io
        # features). Those occasionally hit transient VM-network failures
        # (DNS lookup, dropped TLS). Retry once; Docker layer caching makes the
        # second attempt resume quickly from where the first left off.
        run: |
          for attempt in 1 2; do
            echo "::group::test.sh attempt ${attempt}"
            if .devcontainer/test.sh; then
              echo "::endgroup::"
              echo "test.sh passed on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            echo "test.sh failed on attempt ${attempt}"
          done
          echo "test.sh failed after all attempts"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set dummy keys to see if the tools at least try to connect
          ANTHROPIC_API_KEY: "dummy"
