name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # The release type and versioning are configured in
      # release-please-config.json / .release-please-manifest.json
      - uses: GoogleCloudPlatform/release-please-action@v5
