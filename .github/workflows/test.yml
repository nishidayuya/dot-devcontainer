name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report both CLIs even when one of them fails, instead of cancelling the
      # other leg as soon as the first one breaks.
      fail-fast: false
      matrix:
        cli: [devcontainer, devpod]
    steps:
      - uses: actions/checkout@v4

      # Only the CLI this leg drives is installed. Antigravity CLI and the other
      # tools are checked inside the container by test-common.sh, so the runner
      # does not need them.
      - name: Install Dev Container CLI
        if: matrix.cli == 'devcontainer'
        run: |
          # The standalone installer bundles its own Node.js runtime, so no
          # Node.js/npm setup is required on the runner
          curl -fsSL https://raw.githubusercontent.com/devcontainers/cli/main/scripts/install.sh | sh
          echo "$HOME/.devcontainers/bin" >> "$GITHUB_PATH"

      - name: Install DevPod CLI
        if: matrix.cli == 'devpod'
        run: |
          # DevPod is a single static binary. Its built-in docker provider is
          # registered here so that it targets the runner's Docker daemon; the
          # provider is embedded in the binary, so this needs no extra download.
          # Do not stage the download at /tmp/devpod: DevPod uses that path as a
          # working directory and would then fail with "not a directory".
          install -d -m 0755 "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/devpod" \
            "https://github.com/loft-sh/devpod/releases/latest/download/devpod-linux-$(dpkg --print-architecture)"
          chmod 0755 "$HOME/.local/bin/devpod"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/devpod" provider add docker
          # Same reasoning as in the Dockerfile: keep DevPod from rewriting the
          # ~/.gitconfig that is shared with the host through /dev_container_home
          "$HOME/.local/bin/devpod" context set-options \
            -o SSH_INJECT_GIT_CREDENTIALS=false \
            -o GIT_SSH_SIGNATURE_FORWARDING=false

      - name: Prepare mock files for mounts and authentication
        run: |
          dev_container_home="$HOME/dev_container_home"
          echo "DOT_DEVCONTAINER_HOME=$dev_container_home" >> "$GITHUB_ENV"
          mkdir -p "$dev_container_home/.claude" "$dev_container_home/.gemini"
          # Create dummy credential files to simulate web authentication
          echo '{"loggedIn": true, "dummy": true}' > "$dev_container_home/.claude/.credentials.json"
          echo '{}' > "$dev_container_home/.claude.json"
          git config --file "$dev_container_home/.gitconfig" user.email "you@example.com"
          git config --file "$dev_container_home/.gitconfig" user.name "Your Name"

      - name: Prepare environment
        run: |
          # Ensure GH_TOKEN is set for initializeCommand
          echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" > .devcontainer/.env
          # Mock SSH agent
          ssh-agent -a /tmp/ssh-agent.sock > /dev/null
          echo "SSH_AUTH_SOCK=/tmp/ssh-agent.sock" >> $GITHUB_ENV

      - name: Run test-${{ matrix.cli }}.sh
        run: .devcontainer/test-${{ matrix.cli }}.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set dummy keys to see if the tools at least try to connect
          ANTHROPIC_API_KEY: "dummy"
          # Same as in the Dockerfile: CI has no reason to report usage
          DEVPOD_DISABLE_TELEMETRY: "true"
